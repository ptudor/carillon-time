# Apache 2.4 reverse-proxy example for carillon's loopback monitoring server.
# Include this inside an HTTPS virtual host after enabling mod_proxy,
# mod_proxy_http and mod_auth_basic. The daemon remains bound to
# 127.0.0.1:9124 and ignores forwarding headers.

# Create a dedicated password file outside the document root:
#   htpasswd -c /usr/local/etc/apache24/carillon.htpasswd iphone
# Linux commonly uses /etc/apache2/carillon.htpasswd instead.

ProxyPass        "/carillon/api/v1/status" "http://127.0.0.1:9124/api/v1/status"
ProxyPassReverse "/carillon/api/v1/status" "http://127.0.0.1:9124/api/v1/status"

<Location "/carillon/api/v1/status">
    AuthType Basic
    AuthName "carillon status"
    AuthBasicProvider file
    AuthUserFile /usr/local/etc/apache24/carillon.htpasswd
    Require valid-user
</Location>

# Prometheus normally receives a network ACL instead of the phone's password.
# Replace the documentation prefix before enabling this block.
ProxyPass        "/carillon/metrics" "http://127.0.0.1:9124/metrics"
ProxyPassReverse "/carillon/metrics" "http://127.0.0.1:9124/metrics"

<Location "/carillon/metrics">
    Require ip 192.0.2.0/24
</Location>
